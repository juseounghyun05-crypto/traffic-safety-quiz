준<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만4세 재미있는 교통안전 퀴즈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Jua) for friendly Korean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #EFF6FF;
            touch-action: manipulation;
        }
        .bouncy {
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 select-none bg-blue-50">

    <!-- Header Section -->
    <header class="text-center my-2">
        <div class="inline-block bg-blue-500 text-white px-6 py-2 rounded-full text-2xl md:text-3xl shadow-lg mb-2">
            🚦 안전하게 씽씽! 교통안전 퀴즈 🚗
        </div>
        <p class="text-blue-900 text-lg md:text-xl">그림을 보고 어떤 것이 안전한지 함께 맞춰보아요!</p>
    </header>

    <!-- Main Content Card -->
    <main class="max-w-xl w-full mx-auto bg-white rounded-3xl shadow-xl p-6 border-4 border-blue-200 flex-1 flex flex-col justify-between my-2 relative overflow-hidden">
        
        <!-- Question Progress Bar -->
        <div class="flex justify-between items-center mb-4">
            <span id="quiz-progress" class="bg-blue-100 text-blue-800 text-lg px-4 py-1 rounded-full font-bold">
                문제 1 / 5
            </span>
            <div id="score-display" class="text-2xl font-bold text-yellow-500">
                ⭐ <span id="star-count">0</span>
            </div>
        </div>

        <!-- Quiz Display Area -->
        <div id="quiz-card" class="pop-in flex-1 flex flex-col justify-center items-center text-center">
            
            <!-- Picture Hint Area (Mystery Box) -->
            <div id="question-image" class="text-8xl md:text-9xl my-4 bg-blue-100 p-8 rounded-full w-48 h-48 md:w-56 md:h-56 flex items-center justify-center shadow-inner bouncy border-4 border-blue-300">
                ❓
            </div>

            <!-- Audio / Text Question -->
            <div class="space-y-2 mb-6">
                <button id="speaker-btn" onclick="speakQuestion()" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full text-xl shadow-md transition transform active:scale-95 flex items-center gap-2 mx-auto mb-2">
                    <i class="fas font-solid fa-volume-high"></i> 소리로 듣기
                </button>
                <h2 id="question-text" class="text-2xl md:text-3xl text-gray-800 font-bold leading-relaxed px-2">
                    길을 건널 때, 신호등이 어떤 색일 때 건너야 할까요?
                </h2>
            </div>

            <!-- Answer Options (Grid with Large Pictures & Labels) -->
            <div id="options-container" class="grid grid-cols-2 gap-4 w-full">
                <!-- Options inserted dynamically via JavaScript -->
            </div>
        </div>

        <!-- Result / Reward Area (Hidden Initially) -->
        <div id="result-card" class="hidden flex-1 flex flex-col justify-center items-center text-center pop-in py-8">
            <div class="text-8xl mb-4">🏆</div>
            <h2 class="text-4xl text-blue-900 font-bold mb-2">참 잘했어요!</h2>
            <p id="final-message" class="text-2xl text-blue-700 mb-6">모든 교통안전 퀴즈를 완벽하게 풀었어요!</p>
            <div id="star-reward" class="text-5xl mb-8">⭐⭐⭐⭐⭐</div>
            <button onclick="restartQuiz()" class="bg-green-500 hover:bg-green-600 text-white font-bold text-2xl py-4 px-8 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center gap-3">
                <i class="fas fa-rotate-right"></i> 다시 하기
            </button>
        </div>

    </main>

    <!-- Footer Guide -->
    <footer class="text-center text-blue-800 text-md md:text-lg mt-2">
        💡 선생님/부모님: 글씨를 읽지 못하는 유아는 <span class="bg-blue-200 px-2 py-0.5 rounded-md font-bold">비밀 그림상자</span>와 <span class="bg-blue-200 px-2 py-0.5 rounded-md font-bold">소리 듣기</span> 버튼을 적극 활용해 보세요!
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const quizData = [
            {
                answerEmoji: "🟢",
                question: "길을 건널 때 신호등에 어떤 불이 들어왔을 때 안전하게 건너야 할까요?",
                options: [
                    { text: "초록불", emoji: "🟢" },
                    { text: "빨간불", emoji: "🔴" },
                    { text: "노란불", emoji: "🟡" },
                    { text: "깜빡이는 불", emoji: "🚨" }
                ],
                correctIndex: 0,
                feedback: "맞았어요! 신호등이 초록불이 될 때 건너야 해요!"
            },
            {
                answerEmoji: "✋",
                question: "횡단보도를 안전하게 건널 때 우리는 손을 어떻게 해야 할까요?",
                options: [
                    { text: "주머니에 넣어요", emoji: "🧥" },
                    { text: "손을 높이 들어요", emoji: "✋" },
                    { text: "친구와 손잡고 뛰어요", emoji: "🏃" },
                    { text: "장난감을 만져요", emoji: "🧸" }
                ],
                correctIndex: 1,
                feedback: "정답이에요! 운전자 아저씨가 잘 볼 수 있게 손을 번쩍 들고 건너요!"
            },
            {
                answerEmoji: "🤾",
                question: "차들이 지나다니는 길거리나 주차장에서 놀아도 될까요?",
                options: [
                    { text: "마구 달려요", emoji: "🏃" },
                    { text: "공놀이를 해요", emoji: "⚽" },
                    { text: "위험해서 안 돼요", emoji: "🙅" },
                    { text: "숨바꼭질해요", emoji: "🙈" }
                ],
                correctIndex: 2,
                feedback: "맞았어요! 도로나 차 주위에서 놀면 정말 위험해요!"
            },
            {
                answerEmoji: "🪑",
                question: "자동차에 탔을 때 나의 안전을 지켜주는 고마운 띠는 무엇일까요?",
                options: [
                    { text: "머리띠", emoji: "🎀" },
                    { text: "안전벨트", emoji: "🪑" },
                    { text: "시계", emoji: "⌚" },
                    { text: "가방끈", emoji: "🎒" }
                ],
                correctIndex: 1,
                feedback: "우와! 차를 타면 카시트에 앉아서 안전벨트를 꼭 매야 해요!"
            },
            {
                answerEmoji: "🚶",
                question: "횡단보도를 건널 때는 뛰어가야 할까요, 멈춰서 우측으로 차를 보며 걸어가야 할까요?",
                options: [
                    { text: "느릿느릿 누워요", emoji: "🛌" },
                    { text: "천천히 안전하게 걸어요", emoji: "🚶" },
                    { text: "갑자기 뛰어들어요", emoji: "💨" },
                    { text: "스마트폰을 봐요", emoji: "📱" }
                ],
                correctIndex: 1,
                feedback: "맞아요! 뛰지 않고 서서 왼쪽, 오른쪽 차를 확인한 뒤 천천히 걸어가요!"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const quizProgress = document.getElementById('quiz-progress');
        const starCount = document.getElementById('star-count');
        const questionImage = document.getElementById('question-image');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const quizCard = document.getElementById('quiz-card');
        const resultCard = document.getElementById('result-card');
        const starReward = document.getElementById('star-reward');

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakQuestion() {
            const current = quizData[currentQuestion];
            speakText(current.question);
        }

        function loadQuestion() {
            const current = quizData[currentQuestion];

            quizCard.classList.remove('pop-in');
            void quizCard.offsetWidth;
            quizCard.classList.add('pop-in');

            quizProgress.textContent = `문제 ${currentQuestion + 1} / ${quizData.length}`;
            questionImage.textContent = "❓";
            questionText.textContent = current.question;

            optionsContainer.innerHTML = '';

            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "flex flex-col items-center justify-center p-4 bg-blue-100 hover:bg-blue-200 border-4 border-blue-300 rounded-2xl shadow-md transition transform active:scale-95 text-center";
                btn.onclick = () => checkAnswer(idx);

                btn.innerHTML = `
                    <span class="text-6xl md:text-7xl mb-1">${opt.emoji}</span>
                    <span class="text-2xl md:text-3xl font-bold text-gray-800">${opt.text}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => speakQuestion(), 300);
        }

        function checkAnswer(selectedIndex) {
            const current = quizData[currentQuestion];
            if (selectedIndex === current.correctIndex) {
                questionImage.textContent = current.answerEmoji;
                score++;
                starCount.textContent = score;
                speakText(`정답! ${current.feedback}`);
                showFeedbackModal(true, current.feedback, current.answerEmoji);
            } else {
                speakText("다시 한번 안전한 방법을 생각해보아요!");
                showFeedbackModal(false, "괜찮아요! 어떤 것이 안전할지 다시 생각해 보아요!", "🤔");
            }
        }

        function showFeedbackModal(isCorrect, message, displayEmoji) {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 pop-in";
            
            const card = document.createElement('div');
            card.className = "bg-white p-8 rounded-3xl text-center shadow-2xl max-w-sm w-full border-4 " + (isCorrect ? "border-green-400" : "border-amber-400");
            
            card.innerHTML = `
                <div class="text-8xl mb-4">${isCorrect ? displayEmoji + ' 👏' : '🤔'}</div>
                <h3 class="text-3xl font-bold ${isCorrect ? 'text-green-600' : 'text-amber-600'} mb-2">${isCorrect ? '맞았어요!' : '아쉬워요!'}</h3>
                <p class="text-xl text-gray-700 mb-6 font-bold">${message}</p>
                <button id="next-btn" class="w-full bg-blue-500 text-white text-2xl font-bold py-3 rounded-xl shadow-lg hover:bg-blue-600">
                    ${currentQuestion < quizData.length - 1 ? '다음 문제로 ➡️' : '결과 보기 🎉'}
                </button>
            `;

            overlay.appendChild(card);
            document.body.appendChild(overlay);

            document.getElementById('next-btn').onclick = () => {
                document.body.removeChild(overlay);
                if (currentQuestion < quizData.length - 1) {
                    currentQuestion++;
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            };
        }

        function showFinalResult() {
            quizCard.classList.add('hidden');
            resultCard.classList.remove('hidden');

            let stars = '';
            for (let i = 0; i < score; i++) {
                stars += '⭐';
            }
            if (score === 0) stars = '🎈';

            starReward.textContent = stars;
            const endText = `우와! 별 ${score}개를 모았어요! 멋진 교통안전 왕이에요!`;
            document.getElementById('final-message').textContent = endText;
            speakText(endText);
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            starCount.textContent = 0;
            resultCard.classList.add('hidden');
            quizCard.classList.remove('hidden');
            loadQuestion();
        }

        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>비 중
